name: Android CI
on:
  push:
    branches: [main, 'engineering/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build, lint and test debug variants
        run: gradle assembleDebug lintDebug testDebugUnitTest --no-daemon
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - name: Upload debug APKs for testing only
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks-not-for-production
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
